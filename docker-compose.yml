services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.18.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    entrypoint:
      - /bin/bash
      - -ec
      - >-
        if [[ -z "$$QDRANT__SERVICE__API_KEY" ]]; then
          unset QDRANT__SERVICE__API_KEY;
        fi;
        exec ./entrypoint.sh
    volumes:
      - ./var/qdrant/storage:/qdrant/storage
      - ./var/qdrant/snapshots:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  embeddings:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07}
    platform: ${TEI_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEI_PORT:-8080}:80"
    environment:
      MODEL_ID: ${TEI_MODEL_ID:-Xenova/multilingual-e5-small}
      REVISION: ${TEI_MODEL_REVISION:-761b726dd34fb83930e26aab4e9ac3899aa1fa78}
      POOLING: ${TEI_POOLING:-mean}
      AUTO_TRUNCATE: ${TEI_AUTO_TRUNCATE:-false}
      HUGGINGFACE_HUB_CACHE: /data
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./var/tei:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/80;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  rag-api:
    build:
      context: ./rag-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8090}:8080"
    environment:
      HTTP_ADDR: :8080
      TEI_URL: http://embeddings:80
      TEI_TIMEOUT: ${TEI_TIMEOUT:-10s}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-methodology_e5_small_v1}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-10s}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60s}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-1200}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
      DEEPSEEK_MAX_CONCURRENCY: ${DEEPSEEK_MAX_CONCURRENCY:-4}
      RAG_API_KEY: ${RAG_API_KEY:-}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-24h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-8}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.65}
      RAG_MAX_QUERY_CHARS: ${RAG_MAX_QUERY_CHARS:-4000}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-30000}
      RAG_MAX_CONTEXT_CHUNKS: ${RAG_MAX_CONTEXT_CHUNKS:-8}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_URL: http://127.0.0.1:8080/health/live
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/rag-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  bitrix-bot:
    build:
      context: ./bitrix-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BITRIX_BOT_PORT: ${BITRIX_BOT_PORT:-8080}
      BITRIX_WEBHOOK_PATH: ${BITRIX_WEBHOOK_PATH:-/webhook}
      BITRIX_APPLICATION_TOKEN: ${BITRIX_APPLICATION_TOKEN:-}
      BITRIX_REST_WEBHOOK_URL: ${BITRIX_REST_WEBHOOK_URL:-}
      BITRIX_BOT_ID: ${BITRIX_BOT_ID:-}
      BITRIX_BOT_TOKEN: ${BITRIX_BOT_TOKEN:-}
      RAG_API_URL: ${RAG_API_URL:-http://rag-api:8080}
      RAG_API_KEY: ${RAG_API_KEY:-}
      BITRIX_BOT_COLLECTION: ${BITRIX_BOT_COLLECTION:-methodology_e5_small_v1}
      BOT_REQUEST_TIMEOUT_MS: ${BOT_REQUEST_TIMEOUT_MS:-75000}
    depends_on:
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    environment:
      RAG_API_UPSTREAM: http://rag-api:8080
      NGINX_ENVSUBST_FILTER: ^RAG_API_UPSTREAM$$
    depends_on:
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  https-proxy:
    profiles: ["https"]
    build:
      context: ./deploy/nginx-le
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ:-UTC}
      LETSENCRYPT: ${LETSENCRYPT:-true}
      LE_EMAIL: ${LE_EMAIL:-}
      LE_FQDN: ${LE_FQDN:-devgames.hwschool.online}
    volumes:
      - ./var/nginx-le/ssl:/etc/nginx/ssl
    depends_on:
      web:
        condition: service_healthy
      bitrix-bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/nginx/ssl/le-crt.pem && nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
