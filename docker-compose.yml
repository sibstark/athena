services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    entrypoint:
      - /bin/bash
      - -ec
      - >-
        if [[ -z "$$QDRANT__SERVICE__API_KEY" ]]; then
          unset QDRANT__SERVICE__API_KEY;
        fi;
        exec ./entrypoint.sh
    volumes:
      - ./var/qdrant/storage:/qdrant/storage
      - ./var/qdrant/snapshots:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEI_PORT:-8080}:80"
    environment:
      MODEL_ID: ${EMBEDDING_MODEL_ID:?EMBEDDING_MODEL_ID is required}
      REVISION: ${EMBEDDING_MODEL_REVISION:?EMBEDDING_MODEL_REVISION is required}
      POOLING: ${EMBEDDING_POOLING:?EMBEDDING_POOLING is required}
      AUTO_TRUNCATE: ${EMBEDDING_AUTO_TRUNCATE:?EMBEDDING_AUTO_TRUNCATE is required}
      HUGGINGFACE_HUB_CACHE: /data
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./var/tei:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/80;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  rag-api:
    build:
      context: ./rag-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8090}:8080"
    environment:
      HTTP_ADDR: :8080
      TEI_URL: http://embeddings:80
      TEI_TIMEOUT: ${TEI_TIMEOUT:-10s}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:?EMBEDDING_MODEL_ID is required}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:?EMBEDDING_MODEL_REVISION is required}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?EMBEDDING_DIMENSION is required}
      EMBEDDING_DTYPE: ${EMBEDDING_DTYPE:?EMBEDDING_DTYPE is required}
      EMBEDDING_POOLING: ${EMBEDDING_POOLING:?EMBEDDING_POOLING is required}
      EMBEDDING_NORMALIZED: ${EMBEDDING_NORMALIZED:?EMBEDDING_NORMALIZED is required}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX?EMBEDDING_DOCUMENT_PREFIX is required}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:?EMBEDDING_QUERY_PREFIX is required}
      EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:?EMBEDDING_MAX_INPUT_TOKENS is required}
      EMBEDDING_AUTO_TRUNCATE: ${EMBEDDING_AUTO_TRUNCATE:?EMBEDDING_AUTO_TRUNCATE is required}
      EMBEDDING_PIPELINE_VERSION: ${EMBEDDING_PIPELINE_VERSION:?EMBEDDING_PIPELINE_VERSION is required}
      EMBEDDING_POINT_NAMESPACE: ${EMBEDDING_POINT_NAMESPACE:?EMBEDDING_POINT_NAMESPACE is required}
      EMBEDDING_TOKENIZER_SHA256: ${EMBEDDING_TOKENIZER_SHA256:?EMBEDDING_TOKENIZER_SHA256 is required}
      EMBEDDING_TOKENIZER_CONFIG_SHA256: ${EMBEDDING_TOKENIZER_CONFIG_SHA256:?EMBEDDING_TOKENIZER_CONFIG_SHA256 is required}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:?EMBEDDING_CACHE_DIR is required}
      EMBEDDING_VECTOR_CACHE_SIZE: ${EMBEDDING_VECTOR_CACHE_SIZE:?EMBEDDING_VECTOR_CACHE_SIZE is required}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-10s}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60s}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-1200}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
      DEEPSEEK_MAX_CONCURRENCY: ${DEEPSEEK_MAX_CONCURRENCY:-4}
      RAG_API_KEY: ${RAG_API_KEY:-}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-24h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-8}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.65}
      RAG_MAX_QUERY_CHARS: ${RAG_MAX_QUERY_CHARS:-4000}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-30000}
      RAG_MAX_CONTEXT_CHUNKS: ${RAG_MAX_CONTEXT_CHUNKS:-8}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_URL: http://127.0.0.1:8080/health/live
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/rag-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${BITRIX_BOT_PORT:-8080}
      WEBHOOK_PATH: ${BITRIX_WEBHOOK_PATH:-/webhook}
      LOG_DIR: /app/logs
      APPLICATION_TOKEN: ${BITRIX_APPLICATION_TOKEN:-}
      REST_WEBHOOK_URL: ${BITRIX_REST_WEBHOOK_URL:-}
      BOT_ID: ${BITRIX_BOT_ID:-}
      BOT_TOKEN: ${BITRIX_BOT_TOKEN:-}
      API_URL: ${RAG_API_URL:-http://rag-api:8080}
      API_KEY: ${RAG_API_KEY:-}
      REQUEST_TIMEOUT_MS: ${BOT_REQUEST_TIMEOUT_MS:-75000}
    volumes:
      - bot_logs:/app/logs
    depends_on:
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    environment:
      RAG_API_UPSTREAM: http://rag-api:8080
      NGINX_ENVSUBST_FILTER: ^RAG_API_UPSTREAM$$
    depends_on:
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  https-proxy:
    profiles: ["https"]
    build:
      context: ./deploy/nginx-le
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ:-UTC}
      LETSENCRYPT: ${LETSENCRYPT:-true}
      LE_EMAIL: ${LE_EMAIL:-}
      LE_FQDN: ${LE_FQDN:-devgames.hwschool.online}
    volumes:
      - ./var/nginx-le/ssl:/etc/nginx/ssl
    depends_on:
      web:
        condition: service_healthy
      bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/nginx/ssl/le-crt.pem && nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot_logs:
